version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint*'
          - 'typescript-eslint*'
          - '@typescript-eslint*'
      react:
        patterns:
          - 'react*'
          - '@types/react*'
      test:
        patterns:
          - '@testing-library*'
          - 'vitest*'
    ignore:
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
